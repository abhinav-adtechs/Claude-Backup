name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  install-sh:
    name: install.sh smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: bash -n install.sh

      - name: Install, check and uninstall in a throwaway home
        run: |
          export HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME"
          VAULT="$RUNNER_TEMP/My Vault"

          bash ./install.sh "$VAULT"
          bash ./install.sh --check | tee "$RUNNER_TEMP/check.log"
          grep -q "Resume skill:     installed" "$RUNNER_TEMP/check.log"
          grep -q "Scheduled backup: installed" "$RUNNER_TEMP/check.log"

          # The custom vault path replaces the default one in both installed skills
          for f in "$HOME/.claude/vault-resume/SKILL.md" $(find "$HOME" -path '*Scheduled/session-backup/SKILL.md'); do
            grep -q "$VAULT/" "$f"
            if grep -q "~/Documents/ClaudeVault/" "$f"; then echo "default vault path left in $f"; exit 1; fi
          done
          test -f "$VAULT/.gitignore"

          # Uninstall removes the skills but never the vault
          bash ./install.sh --uninstall
          bash ./install.sh --check | tee "$RUNNER_TEMP/check.log"
          grep -q "Resume skill:     NOT FOUND" "$RUNNER_TEMP/check.log"
          grep -q "Scheduled backup: NOT FOUND" "$RUNNER_TEMP/check.log"
          test -f "$VAULT/.gitignore"

  install-ps1:
    name: install.ps1 smoke test (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        shell: ${{ matrix.shell }}
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\install.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Host $_.Message }; exit 1 }

      - name: Install, check and uninstall in a throwaway home
        shell: ${{ matrix.shell }}
        run: |
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP "home"
          New-Item -ItemType Directory -Force -Path $env:USERPROFILE | Out-Null
          $vault = Join-Path $env:RUNNER_TEMP "My Vault"

          # install.ps1 ends its -Check/-Uninstall branches with exit, so run
          # it in a child process and assert on the exit code instead of
          # calling it inline (which would end this step early).
          $psExe = if ($PSVersionTable.PSEdition -eq "Desktop") { "powershell" } else { "pwsh" }

          & $psExe -NoProfile -File .\install.ps1 -VaultPath $vault
          if ($LASTEXITCODE -ne 0) { throw "install failed with exit code $LASTEXITCODE" }

          $check = & $psExe -NoProfile -File .\install.ps1 -Check
          if (-not ($check -match "Resume skill:     installed")) { throw "resume skill not reported as installed" }
          if (-not ($check -match "Scheduled backup: installed")) { throw "scheduled backup not reported as installed" }

          # The custom vault path replaces the default one in both installed
          # skills, and each file must start with its front matter: a BOM
          # (which Set-Content -Encoding UTF8 writes on Windows PowerShell
          # 5.1) would sit in front of the opening --- and break parsing.
          $skillFiles = @(
            (Join-Path $env:USERPROFILE ".claude\vault-resume\SKILL.md"),
            (Join-Path $env:USERPROFILE "Documents\Claude\Scheduled\session-backup\SKILL.md")
          )
          $vaultFwd = $vault -replace '\\', '/'
          foreach ($f in $skillFiles) {
            $content = Get-Content $f -Raw
            if (-not $content.Contains("$vaultFwd/")) { throw "vault path not substituted in $f" }
            if ($content.Contains("~/Documents/ClaudeVault/")) { throw "default vault path left in $f" }
            $bytes = [System.IO.File]::ReadAllBytes($f)
            if (-not ($bytes[0] -eq 45 -and $bytes[1] -eq 45 -and $bytes[2] -eq 45)) { throw "$f does not start with '---' (BOM?)" }
          }
          if (-not (Test-Path (Join-Path $vault ".gitignore"))) { throw "vault .gitignore missing after install" }

          # Uninstall removes the skills but never the vault
          & $psExe -NoProfile -File .\install.ps1 -Uninstall
          if ($LASTEXITCODE -ne 0) { throw "uninstall failed with exit code $LASTEXITCODE" }

          $check = & $psExe -NoProfile -File .\install.ps1 -Check
          if (-not ($check -match "Resume skill:     NOT FOUND")) { throw "resume skill still present after uninstall" }
          if (-not ($check -match "Scheduled backup: NOT FOUND")) { throw "scheduled backup still present after uninstall" }
          if (-not (Test-Path (Join-Path $vault ".gitignore"))) { throw "vault .gitignore removed by uninstall" }
